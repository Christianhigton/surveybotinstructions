<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GitHub Reference Page</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f6f8fa;
        color: #24292f;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(720px, 100%);
        background: #ffffff;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 40px;
        box-shadow: 0 12px 36px rgba(27, 31, 36, 0.08);
      }

      h1 {
        margin: 0 0 16px;
        font-size: 32px;
        line-height: 1.15;
      }

      p {
        margin: 0;
        font-size: 18px;
        line-height: 1.6;
      }

      code {
        padding: 2px 6px;
        border-radius: 6px;
        background: #eef2f6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GitHub Reference Page</h1>
      <p>This public GitHub Pages site was created from the local <code>githubproompt</code> folder.</p>
    </main>
  </body>
</html>
